name: Daily triage dashboard

# Rebuilds the dashboard from the target repository's issues and pull
# requests at 7:00 New York time every day and publishes it to GitHub Pages.
#
# Cron runs in UTC only, and 7:00 New York is 11:00 UTC in summer (EDT) and
# 12:00 UTC in winter (EST). So both are scheduled, and the when job keeps
# whichever matches New York's current offset. It goes by the cron entry that
# fired, not the clock, so a run that GitHub starts late is not dropped.
on:
  schedule:
    - cron: "0 11 * * *"  # 7:00 EDT (summer)
    - cron: "0 12 * * *"  # 7:00 EST (winter)
  workflow_dispatch:       # the "Run workflow" button, always builds

permissions:
  contents: read

# Never run two deploys at once. A queued run waits rather than cancelling one
# that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  TRIAGE_REPO: agentic-community/mcp-gateway-registry
  # Pinned tool releases from https://github.com/aarora79/jev-samples/releases
  # To upgrade: change the version and paste the linux_amd64 line from that
  # release's SHA256SUMS.
  PR_TRIAGE_VERSION: "0.8.0"
  PR_TRIAGE_SHA256: "76a3e324e9c4c0042b608571ceec9dd54faf414906dad8b7e6879d6bbcd021ff"
  ISSUE_TRIAGE_VERSION: "0.1.0"
  ISSUE_TRIAGE_SHA256: "e91582f5588c2f4af17142f4410d8ee59134aa858eac8770815e89cd251f413a"

jobs:
  when:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      build: ${{ steps.check.outputs.build }}
    steps:
      - name: Decide whether this run is the 7:00 New York one
        id: check
        env:
          EVENT: ${{ github.event_name }}
          FIRED: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ]; then
            echo "Started by $EVENT, building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          zone=$(TZ=America/New_York date +%Z)
          if [ "$zone" = "EDT" ]; then want="0 11 * * *"; else want="0 12 * * *"; fi
          if [ "$FIRED" = "$want" ]; then
            echo "New York is on $zone and \"$FIRED\" is its 7:00 run, building."
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "New York is on $zone, so \"$FIRED\" is not its 7:00 run, skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: when
    if: needs.when.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write  # to commit state/ for the watcher
    steps:
      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Install the triage tools at pinned versions
        run: |
          mkdir -p "$HOME/bin"
          base="https://github.com/aarora79/jev-samples/releases/download"
          curl -fsSL "$base/pr-triage/$PR_TRIAGE_VERSION/pr-triage_${PR_TRIAGE_VERSION}_linux_amd64" -o "$HOME/bin/pr-triage"
          curl -fsSL "$base/issue-triage/$ISSUE_TRIAGE_VERSION/issue-triage_${ISSUE_TRIAGE_VERSION}_linux_amd64" -o "$HOME/bin/issue-triage"
          echo "$PR_TRIAGE_SHA256  $HOME/bin/pr-triage" | sha256sum -c -
          echo "$ISSUE_TRIAGE_SHA256  $HOME/bin/issue-triage" | sha256sum -c -
          chmod +x "$HOME/bin/pr-triage" "$HOME/bin/issue-triage"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # Taken before the fetch, so a change that lands mid-build still differs
      # from the saved fingerprint and the watcher picks it up afterwards.
      - name: Fingerprint the open items
        id: fingerprint
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "value=$(./fingerprint.sh)" >> "$GITHUB_OUTPUT"

      - name: Fetch issues, pull requests and triage reports
        env:
          # The workflow token can read any public repository.
          GH_TOKEN: ${{ github.token }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: ./fetch_data.sh

      - name: Build the HTML
        run: uv run python build_dashboard.py --data-dir data --out site/index.html

      - name: Upload the site for Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

      # The watcher rebuilds between 7:00 runs without the triage tools, so it
      # needs today's triage reports and the fingerprint this page was built from.
      - name: Save triage results and fingerprint for the watcher
        env:
          FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
        run: |
          slug=$(echo "$TRIAGE_REPO" | tr / -)
          mkdir -p state/triage
          cp "data/${slug}-open-all-triage.json" "data/triage-${slug}-open.md" state/triage/
          echo "$FINGERPRINT" > state/fingerprint.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then
            echo "state/ is unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "Daily triage: save results for the watcher"
          git pull --rebase --quiet
          git push --quiet

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
